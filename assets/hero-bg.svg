<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Stylised Southern Alps at dusk with the Southern Cross and a silver fern">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141033"/>
      <stop offset="38%" stop-color="#2c2158"/>
      <stop offset="62%" stop-color="#5c3f6e"/>
      <stop offset="80%" stop-color="#9a5a56"/>
      <stop offset="100%" stop-color="#e2893f"/>
    </linearGradient>
    <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a63"/>
      <stop offset="100%" stop-color="#3a2e52"/>
    </linearGradient>
    <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#32263f"/>
      <stop offset="100%" stop-color="#241c33"/>
    </linearGradient>
    <linearGradient id="nearMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1626"/>
      <stop offset="100%" stop-color="#140f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#ffb46b" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffb46b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
  <rect width="1600" height="760" fill="url(#glow)"/>

  <!-- Southern Cross + pointer stars -->
  <g fill="#ffffff">
    <circle cx="1180" cy="120" r="2.4"/>
    <circle cx="1230" cy="95" r="3"/>
    <circle cx="1255" cy="150" r="2.2"/>
    <circle cx="1200" cy="175" r="1.8"/>
    <circle cx="1310" cy="200" r="1.6"/>
    <g opacity=".85">
      <circle cx="260" cy="90" r="1.6"/>
      <circle cx="340" cy="140" r="1.4"/>
      <circle cx="430" cy="70" r="1.8"/>
      <circle cx="520" cy="120" r="1.3"/>
      <circle cx="700" cy="60" r="1.5"/>
      <circle cx="820" cy="110" r="1.3"/>
      <circle cx="950" cy="80" r="1.7"/>
      <circle cx="1420" cy="100" r="1.5"/>
      <circle cx="1500" cy="160" r="1.3"/>
      <circle cx="90" cy="160" r="1.3"/>
    </g>
  </g>

  <!-- Far mountain range -->
  <path fill="url(#farMtn)" d="M0,420 L80,360 160,400 240,320 320,390 410,300 500,380 590,330 680,400 770,340 860,410 950,350 1040,400 1130,330 1220,400 1310,350 1400,410 1490,360 1600,400 1600,760 0,760 Z"/>

  <!-- Mid mountain range -->
  <path fill="url(#midMtn)" d="M0,500 L100,430 210,480 300,400 400,470 500,410 600,480 700,420 800,490 900,430 1000,480 1100,420 1220,490 1330,440 1440,500 1540,450 1600,480 1600,760 0,760 Z"/>

  <!-- Near mountain / foreground ridge -->
  <path fill="url(#nearMtn)" d="M0,600 L120,540 260,590 380,520 520,600 650,540 800,610 950,550 1100,610 1250,560 1400,620 1600,580 1600,760 0,760 Z"/>

  <!-- Silver fern koru, bottom-left foreground -->
  <g transform="translate(70,560)" opacity=".9">
    <path d="M0,160 C10,100 40,50 100,10" stroke="#f3efe3" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#f3efe3">
      <ellipse cx="18" cy="140" rx="16" ry="6" transform="rotate(-35 18 140)"/>
      <ellipse cx="32" cy="115" rx="18" ry="6.5" transform="rotate(-32 32 115)"/>
      <ellipse cx="48" cy="90" rx="20" ry="7" transform="rotate(-28 48 90)"/>
      <ellipse cx="66" cy="66" rx="20" ry="7" transform="rotate(-22 66 66)"/>
      <ellipse cx="86" cy="45" rx="18" ry="6.5" transform="rotate(-16 86 45)"/>
      <ellipse cx="104" cy="28" rx="14" ry="5.5" transform="rotate(-8 104 28)"/>
    </g>
    <circle cx="100" cy="10" r="5" fill="#f3efe3"/>
  </g>
</svg>
