name: Update election content

# Runs on a schedule to pull fresh NZ election news (RSS) and check the
# seven official party policy pages for changes, then commits the result
# to data/*.json. Netlify/Vercel are set to auto-deploy on push, so this
# is effectively "keep the site live-updated" with no server to run.

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest news & check manifesto pages
        run: node scripts/fetch-updates.mjs

      - name: Commit changes if any
        run: |
          git config user.name "election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: automated content update"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (concurrent update) - rebasing and retrying ($i/5)..."
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
              sleep $((i * 5))
            done
          fi
